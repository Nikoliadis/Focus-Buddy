{% extends "base.html" %}
{% block title %}Verify Your Email | FocusBuddy{% endblock %}

{% block content %}
<section class="auth-card" style="text-align:center;">
  <div style="font-size:2.5rem;margin-bottom:.5rem;">📧</div>
  <h1 style="margin-bottom:.5rem;">Check your inbox</h1>
  <p class="muted" style="margin-top:.25rem;">
    We sent a verification link to <strong>{{ email }}</strong>.<br>
    Click it to activate your account.
  </p>

  <p class="muted" style="margin-top:1.5rem;font-size:.9rem;">
    Didn't get it?
    <a href="{{ url_for('auth.resend_verification_page') }}">Resend verification email</a>
  </p>
</section>
{% endblock %}

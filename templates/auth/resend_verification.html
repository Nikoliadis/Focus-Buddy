{% extends "base.html" %}
{% block title %}Resend Verification | FocusBuddy{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Resend Verification Email</h1>

  <form method="post" action="{{ url_for('auth.resend_verification_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <button class="btn primary" type="submit">Resend Link</button>
  </form>

  <p class="muted">
    Already verified? <a href="{{ url_for('auth.login_page') }}">Log in</a>
  </p>
</section>
{% endblock %}

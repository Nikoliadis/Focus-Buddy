{% extends "base.html" %}
{% block title %}Forgot Password | FocusBuddy{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Forgot Password</h1>
  <p class="muted" style="margin-top:0;">Enter your email and we'll send you a reset link.</p>

  <form method="post" action="{{ url_for('auth.forgot_password_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <button class="btn primary" type="submit">Send Reset Link</button>
  </form>

  <p class="muted">
    Remember it? <a href="{{ url_for('auth.login_page') }}">Back to Login</a>
  </p>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Reset Password | FocusBuddy{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Reset Password</h1>

  <form method="post" action="{{ url_for('auth.reset_password_post', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">New Password</label>
    <div class="password-wrap">
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Show password">👁</button>
    </div>

    <label for="confirm">Confirm Password</label>
    <div class="password-wrap">
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      <button type="button" class="pw-toggle" onclick="togglePw('confirm', this)" aria-label="Show password">👁</button>
    </div>

    <button class="btn primary" type="submit">Set New Password</button>
  </form>
</section>
{% endblock %}

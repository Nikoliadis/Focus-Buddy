{% extends "base.html" %}
{% block title %}Register | FocusBuddy{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Register</h1>

  <form method="post" action="{{ url_for('auth.register_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Show password">👁</button>
    </div>

    <label for="confirm">Confirm Password</label>
    <div class="password-wrap">
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      <button type="button" class="pw-toggle" onclick="togglePw('confirm', this)" aria-label="Show password">👁</button>
    </div>

    <button class="btn primary" type="submit">Create account</button>
  </form>

  <p class="muted" style="margin-top:1rem;">
    Already have an account? <a href="{{ url_for('auth.login_page') }}">Login</a>
  </p>
</section>
{% endblock %}

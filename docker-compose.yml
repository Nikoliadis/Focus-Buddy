services:
  db:
    # PostgreSQL 16 with the pgvector extension (vector similarity search, Phase 16).
    # Switching an existing local volume from postgres:16-alpine (musl) to this Debian (glibc)
    # image keeps the data, but text sort order can differ: run once afterwards
    #   docker compose exec db psql -U focusbuddy -d focusbuddy -c "REINDEX DATABASE focusbuddy;"
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: focusbuddy
      POSTGRES_USER: focusbuddy
      POSTGRES_PASSWORD: focusbuddy_pass
    ports:
      # Change with DB_PORT=5433 if 5432 is already taken on your machine
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusbuddy -d focusbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-secret}"
      COOKIE_SECURE: "0"
      DATABASE_URL: "postgresql+psycopg://focusbuddy:focusbuddy_pass@db:5432/focusbuddy"
      # Optional: FocusBot and transactional emails stay disabled when these are empty
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

services:
  db:
    # PostgreSQL 16 with the pgvector extension (vector similarity search, Phase 16).
    # Switching an existing local volume from postgres:16-alpine (musl) to this Debian (glibc)
    # image keeps the data, but text sort order can differ: run once afterwards
    #   docker compose exec db psql -U focusbuddy -d focusbuddy -c "REINDEX DATABASE focusbuddy;"
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: focusbuddy
      POSTGRES_USER: focusbuddy
      POSTGRES_PASSWORD: focusbuddy_pass
    ports:
      # Change with DB_PORT=5433 if 5432 is already taken on your machine
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusbuddy -d focusbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-secret}"
      COOKIE_SECURE: "0"
      DATABASE_URL: "postgresql+psycopg://focusbuddy:focusbuddy_pass@db:5432/focusbuddy"
      # Optional: FocusBot and transactional emails stay disabled when these are empty
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      FOCUSBOT_MODEL: "${FOCUSBOT_MODEL:-openai/gpt-oss-20b}"
      # Set ML_SERVICE_URL=http://ml:8000 together with `--profile ml` to use the ML service.
      ML_SERVICE_URL: "${ML_SERVICE_URL:-}"
      ML_API_KEY: "${ML_API_KEY:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

  ml:
    # Model serving. Heavy (torch, ~500 MB of RAM once loaded), so it starts only on request:
    #   docker compose --profile ml up --build
    profiles: ["ml"]
    build:
      context: .
      dockerfile: Dockerfile.ml
    environment:
      ML_API_KEY: "${ML_API_KEY:-}"
      DATABASE_URL: "postgresql+psycopg://focusbuddy:focusbuddy_pass@db:5432/focusbuddy"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      FOCUSBOT_MODEL: "${FOCUSBOT_MODEL:-openai/gpt-oss-20b}"
    volumes:
      - ./artifacts:/app/artifacts:ro      # models are trained elsewhere; the service only reads them
      - hf_cache:/root/.cache/huggingface  # keeps the embedding model across restarts
    # No published port: only the web app, on the compose network, can reach it.
    depends_on:
      db:
        condition: service_healthy

volumes:
  hf_cache:
  pgdata:
